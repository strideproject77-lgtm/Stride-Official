workflows:
  stride-ios:
    name: Stride iOS Builder
    max_build_duration: 120
    instance_type: mac_mini_m2

    # Reuse Rust downloads/toolchains and build outputs between Codemagic runs.
    cache_paths:
      - $HOME/.cargo/registry
      - $HOME/.cargo/git
      - $HOME/.rustup/toolchains
      - runtime-rust/target

    # Manual-only: choose CodeMagic from its dashboard when you want this builder.
    # GitHub Actions remains independently available for normal CI and manual IPA builds.

    environment:
      groups:
        - stride-ios
      vars:
        STRIDE_REPOSITORY: strideproject77-lgtm/Stride-Official
        STRIDE_LOG_BRANCH: stride-codemagic-logs
        STRIDE_BUNDLE_ID: com.strideproject.stride
      # Match the known-good Infinity runner image to avoid moving Xcode versions.
      xcode: 26.2
      cocoapods: default

    scripts:
      - name: Build Stride for iPhone and package unsigned IPA
        script: |
          set -Eeuo pipefail
          ROOT="$CM_BUILD_DIR"
          LOG_DIR="$ROOT/.stride-build-logs"
          DERIVED="$CM_BUILD_DIR/.stride-derived-data"
          RUST_TARGET="$CM_BUILD_DIR/runtime-rust/target/aarch64-apple-ios"
          mkdir -p "$LOG_DIR"
          exec > >(tee -a "$LOG_DIR/build.log") 2>&1

          publish_logs() {
            build_status=$?
            trap - EXIT
            set +e
            echo "Build exit status: $build_status" >> "$LOG_DIR/build.log"
            cat > "$LOG_DIR/metadata.json" <<EOF
          {
            "project": "Stride",
            "repository": "strideproject77-lgtm/Stride-Official",
            "branch": "${CM_BRANCH:-unknown}",
            "commit": "${CM_COMMIT:-unknown}",
            "build_id": "${CM_BUILD_ID:-unknown}",
            "build_number": "${CM_BUILD_NUMBER:-unknown}",
            "builder": "Codemagic",
            "exit_status": $build_status,
            "logs_branch": "${STRIDE_LOG_BRANCH}"
          }
          EOF
            # Build one downloadable ZIP containing the IPA (when available) and diagnostics.
            PACKAGE_NAME="Stride-Complete-Artifacts"
            PACKAGE_STAGE="$(mktemp -d)"
            PACKAGE_ROOT="$PACKAGE_STAGE/$PACKAGE_NAME"
            mkdir -p "$PACKAGE_ROOT/build-logs"
            if [ -s "$ROOT/build/ios/Stride-unsigned.ipa" ]; then
              cp -p "$ROOT/build/ios/Stride-unsigned.ipa" "$PACKAGE_ROOT/"
            fi
            for file in "$LOG_DIR"/*; do
              if [ -f "$file" ]; then cp -p "$file" "$PACKAGE_ROOT/build-logs/"; fi
            done
            {
              echo "Stride complete build artifacts"
              echo "Build ID: ${CM_BUILD_ID:-unknown}"
              echo "Build number: ${CM_BUILD_NUMBER:-unknown}"
              echo "Source branch: ${CM_BRANCH:-unknown}"
              echo "Source commit: ${CM_COMMIT:-unknown}"
              echo "Build exit status: $build_status"
              echo "Created UTC: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
              echo
              echo "Contents:"
              echo "- Stride-unsigned.ipa (included when build succeeded)"
              echo "- build-logs/ (available build logs and metadata)"
            } > "$PACKAGE_ROOT/BUILD-INFO.txt"
            rm -f "$ROOT/Stride-Complete-Artifacts.zip"
            (cd "$PACKAGE_STAGE" && ditto -c -k --sequesterRsrc --keepParent "$PACKAGE_NAME" "$ROOT/Stride-Complete-Artifacts.zip")
            rm -rf "$PACKAGE_STAGE"
            if [ -s "$ROOT/Stride-Complete-Artifacts.zip" ]; then
              unzip -t "$ROOT/Stride-Complete-Artifacts.zip" >/dev/null
              echo "Created and validated Stride-Complete-Artifacts.zip."
            else
              echo "WARNING: Could not create Stride-Complete-Artifacts.zip."
            fi

            if [ -n "${STRIDE_LOGS_GITHUB_TOKEN:-}" ]; then
              cd "$ROOT"
              LATEST_TMP="$(mktemp)"
              PUBLISH_DIR="$(mktemp -d)"
              python3 - "$LOG_DIR" "$LATEST_TMP" <<'PY'
          import pathlib, re, sys
          log_dir = pathlib.Path(sys.argv[1])
          output = pathlib.Path(sys.argv[2])
          patterns = [
              (re.compile(r"(?i)(authorization\s*[:=]\s*bearer\s+)[^\s]+"), r"\1[REDACTED]"),
              (re.compile(r"(?i)\b(gh[pousr]_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{20,})\b"), "[REDACTED_GITHUB_TOKEN]"),
              (re.compile(r"(?i)(\b(?:token|password|passwd|client_secret|api[_-]?key)\b\s*[:=]\s*)[^\s,;]+"), r"\1[REDACTED]"),
              (re.compile(r"\bAKIA[0-9A-Z]{16}\b"), "[REDACTED_AWS_KEY]"),
              (re.compile(r"-----BEGIN [A-Z ]*PRIVATE KEY-----.*?-----END [A-Z ]*PRIVATE KEY-----", re.S), "[REDACTED_PRIVATE_KEY]"),
          ]
          sections = []
          for path in sorted(log_dir.iterdir()):
              if path.is_file():
                  text = path.read_text(errors="replace")
                  for pattern, replacement in patterns:
                      text = pattern.sub(replacement, text)
                  sections.append("\n========== " + path.name + " ==========\n" + text + "\n")
          output.write_text("".join(sections))
          PY
              python3 "$ROOT/scripts/codemagic_log_chunks.py" "$LATEST_TMP" "$PUBLISH_DIR"
              git checkout --orphan "$STRIDE_LOG_BRANCH" >/dev/null 2>&1
              git rm -rf --ignore-unmatch . >/dev/null 2>&1
              cp "$PUBLISH_DIR"/latest* "$ROOT/"
              rm -rf "$PUBLISH_DIR" "$LATEST_TMP"
              git add -f latest latest.metadata.json
              for part in "$ROOT"/latest.part*; do
                if [ -f "$part" ]; then git add -f "$part"; fi
              done
              git commit -m "chore(logs): replace latest CodeMagic log (${CM_BUILD_NUMBER:-unknown})" >/dev/null 2>&1
              AUTH="$(printf 'x-access-token:%s' "$STRIDE_LOGS_GITHUB_TOKEN" | base64 | tr -d '\n')"
              git -c "http.extraheader=AUTHORIZATION: basic $AUTH" push --force "https://github.com/strideproject77-lgtm/Stride-Official.git" "HEAD:refs/heads/$STRIDE_LOG_BRANCH"
              push_status=$?
              unset AUTH
              if [ "$push_status" -eq 0 ]; then
                echo "Stride latest log and all numbered parts published to $STRIDE_LOG_BRANCH."
              else
                echo "WARNING: Could not publish latest log parts to $STRIDE_LOG_BRANCH; see CodeMagic artifacts."
              fi
            else
              echo "WARNING: STRIDE_LOGS_GITHUB_TOKEN is not configured; logs remain in CodeMagic artifacts."
            fi
            exit "$build_status"
          }
          trap publish_logs EXIT

          python3 -m unittest discover -s tests -p 'test_codemagic_log_chunks.py' -v 2>&1 | tee "$LOG_DIR/log-chunk-tests.log"

          echo "Project: Stride"
          echo "Repository: $STRIDE_REPOSITORY"
          echo "Source branch: ${CM_BRANCH:-unknown}"
          echo "Source commit: ${CM_COMMIT:-unknown}"
          echo "Codemagic build: ${CM_BUILD_NUMBER:-unknown}"

          # Keep Homebrew setup from spending time on automatic update/cleanup.
          export HOMEBREW_NO_AUTO_UPDATE=1
          export HOMEBREW_NO_INSTALL_CLEANUP=1

          # Install Rust with the official rustup bootstrapper only when absent.
          # Cached stable toolchains and targets are reused on subsequent builds.
          export PATH="$HOME/.cargo/bin:$PATH"
          if ! command -v rustup >/dev/null 2>&1; then
            echo "Rustup not found; installing with the official installer."
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          command -v rustup
          if ! rustup toolchain list | grep -Eq '^stable(-|$)'; then
            rustup toolchain install stable --profile minimal
          else
            echo "Stable Rust toolchain already available; reusing cache."
          fi
          if ! rustup target list --toolchain stable --installed | grep -Fxq 'aarch64-apple-ios'; then
            rustup target add aarch64-apple-ios --toolchain stable
          else
            echo "iOS ARM64 Rust target already available; reusing cache."
          fi
          rustup default stable
          rustc --version
          cargo --version

          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          else
            echo "XcodeGen already available; skipping installation."
          fi
          xcodegen --version
          xcodebuild -version

          swift Scripts/generate-app-icon.swift

          cargo test --manifest-path runtime-rust/Cargo.toml 2>&1 | tee "$LOG_DIR/rust-tests.log"
          cargo build --manifest-path runtime-rust/Cargo.toml -p stride-dex-ffi --release --target aarch64-apple-ios 2>&1 | tee "$LOG_DIR/rust-ios-build.log"
          RUST_LIBRARY="$RUST_TARGET/release/libstride_dex_ffi.a"
          test -s "$RUST_LIBRARY"

          xcodebuild -create-xcframework \
            -library "$RUST_LIBRARY" \
            -headers runtime-rust/crates/dex-ffi/include \
            -output runtime-rust/target/StrideDexFFI.xcframework 2>&1 | tee "$LOG_DIR/xcframework.log"
          test -s runtime-rust/target/StrideDexFFI.xcframework/Info.plist

          xcodegen generate 2>&1 | tee "$LOG_DIR/xcodegen.log"
          xcodebuild -resolvePackageDependencies -project Stride.xcodeproj -scheme Stride 2>&1 | tee "$LOG_DIR/package-resolution.log"

          xcodebuild \
            -project Stride.xcodeproj \
            -scheme Stride \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$DERIVED" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee "$LOG_DIR/xcodebuild.log"

          APP_PATH="$DERIVED/Build/Products/Release-iphoneos/Stride.app"
          test -d "$APP_PATH"
          test -s "$APP_PATH/Info.plist"
          plutil -lint "$APP_PATH/Info.plist"
          EXECUTABLE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP_PATH/Info.plist")
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist")
          test "$BUNDLE_ID" = "$STRIDE_BUNDLE_ID"
          test -s "$APP_PATH/$EXECUTABLE_NAME"
          lipo -archs "$APP_PATH/$EXECUTABLE_NAME" | tr ' ' '\n' | grep -Fxq arm64

          mkdir -p "$CM_BUILD_DIR/build/ios/ipa/Payload"
          ditto "$APP_PATH" "$CM_BUILD_DIR/build/ios/ipa/Payload/Stride.app"
          (cd "$CM_BUILD_DIR/build/ios/ipa" && /usr/bin/zip -qry "$CM_BUILD_DIR/build/ios/Stride-unsigned.ipa" Payload)
          test -s "$CM_BUILD_DIR/build/ios/Stride-unsigned.ipa"
          unzip -t "$CM_BUILD_DIR/build/ios/Stride-unsigned.ipa" 2>&1 | tee "$LOG_DIR/ipa-validation.log"
          shasum -a 256 "$CM_BUILD_DIR/build/ios/Stride-unsigned.ipa" | tee "$LOG_DIR/ipa-sha256.txt"
          ls -lh "$CM_BUILD_DIR/build/ios/Stride-unsigned.ipa"

    artifacts:
      - Stride-Complete-Artifacts.zip
      - .stride-build-logs/*.log
      - .stride-build-logs/metadata.json

    publishing:
      email:
        recipients:
          - strideproject77@gmail.com
        notify:
          success: true
          failure: true
