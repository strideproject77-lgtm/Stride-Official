name: iOS Build

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_ios:
        description: "Build the unsigned iOS app/IPA (leave off for routine Rust checks)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

# Keep only the latest check for each ref; iOS builds are deliberate manual runs.
concurrency:
  group: stride-ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-tests:
    name: Rust tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run Rust unit tests
        run: cargo test --manifest-path runtime-rust/Cargo.toml

  ios-build:
    name: Build unsigned iOS IPA
    if: github.event_name == 'workflow_dispatch' && inputs.build_ios
    needs: rust-tests
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Set up Rust iOS targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - name: Build Rust DEX FFI for iOS
        run: |
          cargo build --manifest-path runtime-rust/Cargo.toml -p stride-dex-ffi --release --target aarch64-apple-ios
          cargo build --manifest-path runtime-rust/Cargo.toml -p stride-dex-ffi --release --target aarch64-apple-ios-sim
          xcodebuild -create-xcframework -library runtime-rust/target/aarch64-apple-ios/release/libstride_dex_ffi.a -headers runtime-rust/crates/dex-ffi/include -library runtime-rust/target/aarch64-apple-ios-sim/release/libstride_dex_ffi.a -headers runtime-rust/crates/dex-ffi/include -output runtime-rust/target/StrideDexFFI.xcframework

      - name: Generate Xcode project
        run: xcodegen generate

      # The hosted Mac runner cannot connect to Apple's Simulator service.
      # Compile for a physical iOS device; simulator tests need another runner.
      - name: Build for physical iOS devices
        run: |
          xcodebuild \
            -project Stride.xcodeproj \
            -scheme Stride \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/StrideDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        run: |
          APP_PATH="$RUNNER_TEMP/StrideDerivedData/Build/Products/Release-iphoneos/Stride.app"
          test -d "$APP_PATH"
          plutil -lint "$APP_PATH/Info.plist"
          STAGING="$RUNNER_TEMP/stride-ipa"
          mkdir -p "$STAGING/Payload"
          cp -R "$APP_PATH" "$STAGING/Payload/Stride.app"
          cd "$STAGING"
          /usr/bin/zip -qry "$GITHUB_WORKSPACE/Stride-unsigned.ipa" Payload
          test -s "$GITHUB_WORKSPACE/Stride-unsigned.ipa"
          unzip -l "$GITHUB_WORKSPACE/Stride-unsigned.ipa"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Stride-unsigned-IPA
          path: Stride-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
