name: iOS Build

on:
  push:
    branches: [main, feat/dex-class-method-loader]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Keep the latest check for each ref; macOS is reserved for intentional iOS builds.
concurrency:
  group: stride-ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-tests:
    name: Rust tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run Rust unit tests
        run: cargo test --manifest-path runtime-rust/Cargo.toml

  ios-build:
    name: Build unsigned iOS IPA
    if: github.event_name != 'pull_request'
    needs: rust-tests
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Install iOS Simulator runtime
        run: xcodebuild -downloadPlatform iOS

      - name: Select an available iPhone simulator
        shell: bash
        run: |
          xcrun simctl list devices available -j > "$RUNNER_TEMP/available-simulators.json"
          SIMULATOR_UDID="$(python3 -c 'import json,sys; data=json.load(open(sys.argv[1])); devices=[d for group in data["devices"].values() for d in group if d.get("isAvailable") and d.get("name","").startswith("iPhone")]; print(devices[0]["udid"] if devices else "")' "$RUNNER_TEMP/available-simulators.json")"
          if [ -z "$SIMULATOR_UDID" ]; then
            echo "No available iPhone simulator after installing the iOS runtime."
            xcrun simctl list devices available
            exit 1
          fi
          echo "Using iPhone simulator: $SIMULATOR_UDID"
          echo "STRIDE_SIMULATOR_UDID=$SIMULATOR_UDID" >> "$GITHUB_ENV"

      - name: Run Swift unit tests
        run: |
          xcodebuild test \
            -project Stride.xcodeproj \
            -scheme Stride \
            -destination "platform=iOS Simulator,id=$STRIDE_SIMULATOR_UDID" \
            -derivedDataPath "$RUNNER_TEMP/StrideTestDerivedData" \
            CODE_SIGNING_ALLOWED=NO

      - name: Build for physical iOS devices
        run: |
          xcodebuild \
            -project Stride.xcodeproj \
            -scheme Stride \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/StrideDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        run: |
          APP_PATH="$RUNNER_TEMP/StrideDerivedData/Build/Products/Release-iphoneos/Stride.app"
          test -d "$APP_PATH"
          plutil -lint "$APP_PATH/Info.plist"
          STAGING="$RUNNER_TEMP/stride-ipa"
          mkdir -p "$STAGING/Payload"
          cp -R "$APP_PATH" "$STAGING/Payload/Stride.app"
          cd "$STAGING"
          /usr/bin/zip -qry "$GITHUB_WORKSPACE/Stride-unsigned.ipa" Payload
          test -s "$GITHUB_WORKSPACE/Stride-unsigned.ipa"
          unzip -l "$GITHUB_WORKSPACE/Stride-unsigned.ipa"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Stride-unsigned-IPA
          path: Stride-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
