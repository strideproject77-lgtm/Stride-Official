name: Stride iOS IPA Builder

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      build_ipa:
        description: "Build and package the unsigned iOS IPA"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

# Keep independent event/ref runs from cancelling one another.
concurrency:
  group: stride-ipa-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rust-tests:
    name: Rust runtime tests
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Stride source
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run complete Rust test suite
        run: cargo test --manifest-path runtime-rust/Cargo.toml

  ios-compile-validation:
    name: Compile iOS app (no IPA packaging)
    needs: rust-tests
    runs-on: macos-latest
    timeout-minutes: 75
    steps:
      - name: Checkout Stride source
        uses: actions/checkout@v4
      - name: Select stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then brew install xcodegen; fi
          xcodegen --version
      - name: Install Rust for iOS device
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios
      - name: Build Rust runtime for iOS
        run: |
          set -euo pipefail
          cargo build --manifest-path runtime-rust/Cargo.toml -p stride-dex-ffi --release --target aarch64-apple-ios
          test -s runtime-rust/target/aarch64-apple-ios/release/libstride_dex_ffi.a
      - name: Create device XCFramework
        run: |
          set -euo pipefail
          xcodebuild -create-xcframework -library runtime-rust/target/aarch64-apple-ios/release/libstride_dex_ffi.a -headers runtime-rust/crates/dex-ffi/include -output runtime-rust/target/StrideDexFFI.xcframework
          test -s runtime-rust/target/StrideDexFFI.xcframework/Info.plist
      - name: Generate Xcode project
        run: |
          set -euo pipefail
          xcodegen generate
          test -s Stride.xcodeproj/project.pbxproj
      - name: Resolve iOS package dependencies
        run: xcodebuild -resolvePackageDependencies -project Stride.xcodeproj -scheme Stride
      - name: Compile app for physical iPhones (no IPA)
        run: |
          set -euo pipefail
          xcodebuild -project Stride.xcodeproj -scheme Stride -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/StrideCompileOnly" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          test -d "$RUNNER_TEMP/StrideCompileOnly/Build/Products/Release-iphoneos/Stride.app"

  build-ipa:
    name: Build and verify unsigned iOS IPA
    if: (github.event_name == 'workflow_dispatch' && inputs.build_ipa == true) || (github.event_name == 'push' && contains(github.event.head_commit.message, 'Build Stride unsigned IPA after tests'))
    needs: [rust-tests, ios-compile-validation]
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Checkout Stride source
        uses: actions/checkout@v4

      - name: Select stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Install Rust for iOS device
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Build Stride Rust runtime for iPhone
        run: |
          set -euo pipefail
          cargo build \
            --manifest-path runtime-rust/Cargo.toml \
            -p stride-dex-ffi \
            --release \
            --target aarch64-apple-ios

          RUST_LIBRARY="runtime-rust/target/aarch64-apple-ios/release/libstride_dex_ffi.a"
          test -s "$RUST_LIBRARY"
          echo "Rust iOS library:"
          ls -lh "$RUST_LIBRARY"
          file "$RUST_LIBRARY"

      - name: Create device XCFramework
        run: |
          set -euo pipefail
          RUST_LIBRARY="runtime-rust/target/aarch64-apple-ios/release/libstride_dex_ffi.a"
          xcodebuild -create-xcframework \
            -library "$RUST_LIBRARY" \
            -headers runtime-rust/crates/dex-ffi/include \
            -output runtime-rust/target/StrideDexFFI.xcframework
          test -s runtime-rust/target/StrideDexFFI.xcframework/Info.plist
          plutil -lint runtime-rust/target/StrideDexFFI.xcframework/Info.plist

      - name: Generate Stride Home Screen icon
        run: |
          set -euo pipefail
          swift Scripts/generate-app-icon.swift
          ICON="Assets.xcassets/AppIcon.appiconset/StrideAppIcon.png"
          CONTENTS="Assets.xcassets/AppIcon.appiconset/Contents.json"
          test -s "$ICON"
          test -s "$CONTENTS"
          plutil -lint -s -r "$CONTENTS" >/dev/null 2>&1 || python3 -m json.tool "$CONTENTS" >/dev/null
          WIDTH=$(sips -g pixelWidth "$ICON" | awk '/pixelWidth/ {print $2}')
          HEIGHT=$(sips -g pixelHeight "$ICON" | awk '/pixelHeight/ {print $2}')
          test "$WIDTH" = "1024"
          test "$HEIGHT" = "1024"
          file "$ICON"
          echo "Verified app icon: ${WIDTH}x${HEIGHT}";

      - name: Generate Xcode project
        run: |
          set -euo pipefail
          xcodegen generate
          test -s Stride.xcodeproj/project.pbxproj

      - name: Resolve iOS package dependencies
        run: |
          xcodebuild \
            -resolvePackageDependencies \
            -project Stride.xcodeproj \
            -scheme Stride

      - name: Compile Stride for physical iPhones
        run: |
          set -euo pipefail
          xcodebuild \
            -project Stride.xcodeproj \
            -scheme Stride \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/StrideDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Verify built iOS application
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/StrideDerivedData/Build/Products/Release-iphoneos/Stride.app"
          PLIST="$APP_PATH/Info.plist"

          test -d "$APP_PATH"
          test -s "$PLIST"
          plutil -lint "$PLIST"

          EXECUTABLE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$PLIST")
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$PLIST")
          EXECUTABLE="$APP_PATH/$EXECUTABLE_NAME"

          test "$BUNDLE_ID" = "com.strideproject.stride"
          test -s "$EXECUTABLE"
          ARCHS=$(lipo -archs "$EXECUTABLE")
          echo "Executable architectures: $ARCHS"
          printf '%s\n' "$ARCHS" | tr ' ' '\n' | grep -Fxq arm64

          echo "Verified bundle: $BUNDLE_ID"
          echo "Executable: $EXECUTABLE_NAME"
          file "$EXECUTABLE"
          ls -lh "$EXECUTABLE"
          du -sh "$APP_PATH"

      - name: Package and validate unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/StrideDerivedData/Build/Products/Release-iphoneos/Stride.app"
          STAGING="$RUNNER_TEMP/stride-ipa"
          IPA="$GITHUB_WORKSPACE/Stride-unsigned.ipa"

          rm -rf "$STAGING" "$IPA"
          mkdir -p "$STAGING/Payload"
          ditto "$APP_PATH" "$STAGING/Payload/Stride.app"

          cd "$STAGING"
          /usr/bin/zip -qry "$IPA" Payload

          test -s "$IPA"
          unzip -t "$IPA"
          unzip -Z1 "$IPA" | grep -Fx "Payload/Stride.app/Info.plist"
          unzip -Z1 "$IPA" | grep -Fx "Payload/Stride.app/Stride"

          echo "IPA size:"
          ls -lh "$IPA"
          echo "Uncompressed app contents:"
          du -sh "$STAGING/Payload/Stride.app"
          shasum -a 256 "$IPA"

      - name: Write build verification report
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/StrideDerivedData/Build/Products/Release-iphoneos/Stride.app"
          EXECUTABLE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP_PATH/Info.plist")
          {
            echo "Stride unsigned iOS build"
            echo "Commit: $GITHUB_SHA"
            echo "Branch: $GITHUB_REF_NAME"
            echo "Run: $GITHUB_RUN_NUMBER"
            echo "Bundle ID: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist")"
            echo "Executable: $EXECUTABLE_NAME"
            echo "Executable bytes: $(stat -f%z "$APP_PATH/$EXECUTABLE_NAME")"
            echo "App bundle bytes: $(du -sk "$APP_PATH" | awk '{print $1 * 1024}')"
            echo "IPA bytes: $(stat -f%z "$GITHUB_WORKSPACE/Stride-unsigned.ipa")"
            echo "IPA SHA-256: $(shasum -a 256 "$GITHUB_WORKSPACE/Stride-unsigned.ipa" | awk '{print $1}')"
            echo "Signing: Disabled (unsigned IPA)"
          } > "$GITHUB_WORKSPACE/Stride-Build-Report.txt"
          cat "$GITHUB_WORKSPACE/Stride-Build-Report.txt"

      - name: Upload IPA and verification report
        uses: actions/upload-artifact@v4
        with:
          name: Stride-unsigned-IPA-${{ github.run_number }}
          path: |
            Stride-unsigned.ipa
            Stride-Build-Report.txt
          if-no-files-found: error
          retention-days: 14
