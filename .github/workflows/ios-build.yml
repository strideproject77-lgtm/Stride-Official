name: iOS Build

on:
  push:
    branches: [main, feat/dex-class-method-loader]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Keep the latest check for each ref; macOS is reserved for intentional iOS builds.
concurrency:
  group: stride-ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-tests:
    name: Rust tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run Rust unit tests
        run: cargo test --manifest-path runtime-rust/Cargo.toml

  ios-build:
    name: Build unsigned iOS IPA
    if: github.event_name != 'pull_request'
    needs: rust-tests
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # This hosted Mac runner cannot connect to Apple's Simulator service.
      # Compile the iOS app for a generic physical device below; simulator tests
      # must run on a runner with a working iOS Simulator runtime.
      - name: Build for physical iOS devices
        run: |
          xcodebuild \
            -project Stride.xcodeproj \
            -scheme Stride \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/StrideDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        run: |
          APP_PATH="$RUNNER_TEMP/StrideDerivedData/Build/Products/Release-iphoneos/Stride.app"
          test -d "$APP_PATH"
          plutil -lint "$APP_PATH/Info.plist"
          STAGING="$RUNNER_TEMP/stride-ipa"
          mkdir -p "$STAGING/Payload"
          cp -R "$APP_PATH" "$STAGING/Payload/Stride.app"
          cd "$STAGING"
          /usr/bin/zip -qry "$GITHUB_WORKSPACE/Stride-unsigned.ipa" Payload
          test -s "$GITHUB_WORKSPACE/Stride-unsigned.ipa"
          unzip -l "$GITHUB_WORKSPACE/Stride-unsigned.ipa"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Stride-unsigned-IPA
          path: Stride-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
